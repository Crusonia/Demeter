    protocol_path: docs/validation/food-intake-reproduction-protocol-v1.json
    protocol_sha256: 63b13182e3d1d5bdcf11be34d4c085c1753c580c137c587b5246941a77ecffe8
    analysis:
      participants: 20
      days_per_diet: 14
      diets:
      - PROC
      - UNPROC
      sequences:
        PU:
        - PROC
        - UNPROC
        UP:
        - UNPROC
        - PROC
      confidence_level: 0.95
      published_difference_kcal_per_day: 508
      published_standard_error_kcal_per_day: 106
      published_rounding_unit_kcal_per_day: 1
    published_summary_source: https://pubmed.ncbi.nlm.nih.gov/31105044/
scientific_blockers:
- National age-specific metabolic transition hazards are unresolved.
- Age-specific T2D/prediabetes initial prevalence is not calibrated; CDC total diabetes includes
  other types.
- Dietary causal coefficient, dose scale, lag, and supported population are unresolved.
- State mortality hazard ratios remain synthetic.
- No historical end-to-end dietary-effect validation; mortality persistence backtest is a limited
  benchmark.
