    analysis:
      selection:
        worksheet: Table 4
        columns:
        - A
        - B
        - C
        - D
        header_rows:
        - 1
        - 2
        - 3
        - 4
        first_source_row: 5
        row_scan: All selected-column positions from first_source_row through the
          maximum of declared worksheet dimension and selected-column cells. Retain
          absent positions/all-empty layout rows separately; no clinical participant
          denominator inferred.
        no_other_numeric_outcomes: Never read other worksheet outcomes or numeric
          values outside A:D. Other workbook-level structure may be checked only for
          source integrity and selected-range resolution.
        no_cross_sheet_join: true
        no_cross_block_join: true
        no_record_deduplication: true
        no_forward_fill: true
        no_merged_anchor_resolution: true
      expected_headers:
        A1: 'Table 4: Secondary analyses'
        A2: Glycemic parameters
        C3: Baseline
        D3: 6 months
        A4: Group
        B4: Glycemic status
        C4: FPG (mg/dL)
        D4: FPG (mg/dL)
      raw_cell_preservation:
        kind_precedence:
        - formula
        - error
        - date
        - boolean
        - blank_or_absent
        - numeric
        - text
        - other_unresolved
        formula: Retain formula/cached-type existence locally; never execute or treat
          cached result as laboratory evidence.
        blank: Distinguish absent cell, explicit blank, empty text and all-empty layout
          row where OOXML supports that distinction. No missing→zero.
        numeric: Distinguish positive finite, zero, negative and nonfinite numbers.
          No zero/negative/nonfinite value treated as blank or as a clinical state.
          Positive finite is not a laboratory-validity claim.
        boolean: Retain as boolean, never0/1 glucose.
        date: Detect explicit date cell or numeric cell with date-formatted style;
          retain opaque date/serial, never glucose or inferred visit time.
        text: Retain as opaque text/unknown marker. Do not coerce numeric-looking
          strings, parse undocumented clinical codes or assign negative-test/absent-event
          meanings.
        error: Preserve source Excel error kind; no clinical missingness/withdrawal/death
          reason assigned.
        merged_A_B: Detect selected-body merges and unresolved anchors; do not propagate
          arm/status labels to adjacent rows.
      safe_aggregate_outputs:
        allowed:
        - source/protocol/receipt integrity checks and implementation provenance
        - source range and header validation
        - counts of raw selected-cell kinds per A/B/C/D
        - counts of positive finite/zero/negative/nonfinite numeric FPG cells separately
        - counts of absent/blank/text/error/formula/date/bool/unresolved FPG cells
          separately
        - counts of same-row raw C/D kind-combinations; explicitly not verified paired
          participants
        - count of all-empty A:D layout rows separately from nonempty source records
        - counts of source-body merge structures and missing/unresolved group cells
        - count of distinct nonempty textual A group tokens and frequency for source-reviewed
          safe labels only
        - explicit unknown requirements and clinical-fit/activation refusal
        safe_group_labels:
        - PBO
        - T63 TID
        - T63 BID
        group_label_normalization: Unicode whitespace collapse only; raw original
          retained locally. No case folding, alias guessing, forward fill or inferred
          numeric-code mapping. Unrecognized labels summarized by counts only, never
          raw strings.
        B_status_output: Only raw-kind/empty/distinct-token coverage; no status labels,
          diagnostic strata or clinical categories exported.
        forbidden:
        - participant or source-row dumps/IDs
        - individual FPG values or numeric ranges
        - FPG sums, means, distributions, changes, correlations or treatment contrasts
        - thresholds, inferred diagnoses, negative tests, remission or latent clinical
          states
        - imputation, MAR/independent censoring assumptions, missing-as-noncase
        - clinical likelihood, hazard/dose/lag fit, causal effect or national activation
    parameter_keys: []
    uncertainty: Fixed-release source-layout diagnostics only; no sampling intervals,
      clinical measurement error model, missingness mechanism, imputation or efficacy
      uncertainty fitted.
    clinical_fit_allowed: false
    engine_activation_allowed: false
