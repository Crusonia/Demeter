    population: U.S. noninstitutionalized adult fasting subsample under the existing
      eligible adult and known-pregnancy rules; unknown categories retained
    geography: United States
    time_period: NHANES 2017-March 2020
    unit: Category proportions in fraction; sampling covariance in fraction squared
    uncertainty: Joint multivariate Taylor sampling covariance of existing complete
      categories and disjoint partial category sets across registered age/sex domains.
      Bound endpoints use a fixed linear projection. No fitted distribution or
      simultaneous interval; measurement, missingness bias and transport unresolved.
