    value: 0.5
    unit: fraction
    status: synthetic
    evidence_grade: E
    model_role: benchmark_only
    source: Demeter-authored two-container teaching exercise; no empirical source
    population: Abstract tokens, not people
    geography: Not applicable
    time_period: Abstract ticks, not calendar years
    lower_bound: 0
    upper_bound: 1
    uncertainty: {kind: uniform, low: 0.25, high: 1.0, rationale: "Illustrative adjustment speeds; not an empirical confidence interval"}
