    citation: doi:10.1001/jamainternmed.2020.8774
    source_id: aric_rooney_2021_corrected
    population: ARIC visit-5 participants without diabetes; ages 71-90 at baseline; community cohort.
    geography: United States
    time_period: 2011-2013 baseline; follow-up through 2017
    exposure_definition: HbA1c-defined prediabetes
    outcome_definition: Incident total diabetes; diagnosed or lab/medication defined
    model_role: benchmark_only
    lower_bound: 0
    uncertainty:
      kind: interval
      low: 0.0189
      high: 0.0275
