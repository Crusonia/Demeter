    analysis:
      absolute_tolerance: 1.0e-12
      counterexample_scale: 2.0
      diagnostic_years:
      - 1
      - 2
      dose_lag_witness: L(t)=beta*delta*[1-exp(-t/tau)] through relax. Dose/coefficient rescaling (delta/scale,beta*scale,tau)
        preserves the trajectory. Lag/coefficient rescaling (delta,beta*[1-exp(-1/tau)]/[1-exp(-1/(scale*tau))],scale*tau)
        preserves year1 but changes year2.
      endpoint_witness: Normalize existing synthetic H/IR shares, D0=0. A=(a,r,d/scale), pA=dA/(rA+dA)*[-expm1(-(rA+dA))].
        B has gB=scale*(rA+dA), dB=pA*gB/[-expm1(-gB)], rB=gB-dB, unchanged a. C changes only a to scale*a.
        Test same year1 D entry, different endpoint stocks/year2 entries, conservation and analytic arithmetic.
      evidence_grade: E
      functions:
      - demeter.health.transitions.transition_survivors
      - demeter.nutrition.response.relax
      limitation: Counterexamples concern the isolated implemented annual survivor operator and synthetic
        dietary response. They are not formal identifiability results for the trial multi-year adjusted
        Cox likelihood; the source HR is never used as a one-year risk ratio or input to these witnesses.
      model_role: benchmark_only
      'null': Identical hazards reproduce reference output; zero response gives multiplier one. Mathematical
        hypotheses, not observed zero clinical effects.
      population_scale: 1.0
      registry_references:
      - h_to_ir_rate
      - ir_to_h_rate
      - ir_to_t2d_rate
      - initial_healthy_share
      - initial_ir_share
      - beta_upf_progression
      - diet_lag_years
