    - {age_group: '20_39', sex: female, n: 580, percent: 4.7}
    - {age_group: '40_59', sex: all, n: 1279, percent: 16.4}
    - {age_group: '40_59', sex: male, n: 594, percent: 17.1}
    - {age_group: '40_59', sex: female, n: 685, percent: 15.9}
    - {age_group: 60_plus, sex: all, n: 1378, percent: 30.0}
    - {age_group: 60_plus, sex: male, n: 703, percent: 36.3}
    - {age_group: 60_plus, sex: female, n: 675, percent: 24.4}
