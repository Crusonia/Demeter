    geography: United States
    time_period: 2017-March 2020
    unit: fraction of the specified age and sex domain
    model_role: benchmark_only
    source_store: data/sources/nhanes/2017-2020
    manifest: src/demeter/data/bundled/nhanes_prevalence_manifest.json
    transformation: demeter.data.nhanes.rebuild_nhanes
    uncertainty: Taylor linearized survey variance; logit-t intervals; no causal or transport uncertainty
    limitations: All-type diabetes is not T2D; normoglycemia is not overall metabolic health; cross-sectional data do not identify transitions
    definition_sources:
