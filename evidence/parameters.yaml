        no likelihood, covariance or intervals; make unavailable inferential outputs explicit.
      evaluation: Source reproduction, independent mathematical normalization/likelihood/covariance
        tests and no engine-change checks. No compatible independent clinical evaluation has been
        selected; keep it unresolved.
