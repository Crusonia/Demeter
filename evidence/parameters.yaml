datasets:
  mortality_validation:
    status: derived
    evidence_grade: C
    model_role: prediction_benchmark_only
    protocol: docs/validation/mortality-validation-protocol-v1.json
    protocol_sha256: 440c44a18a743e6c9d1cc345aabbaf7631033fdb640d9062bba6a748c0abb091
    implementation_amendment:
      path: docs/validation/mortality-validation-implementation-amendment-1.json
      sha256: 482f1289c0925bdcfeb823e10ba0b366418cdcf24e6345cf28e85a57bf4b323a
    rfc: docs/rfcs/RFC-55-mortality-holdout.md
    development_cycle: 2011-2012
    validation_cycle: 2013-2014
    mortality_release: 2019 public-use
    source_store: data/sources/nhanes-mortality/2013-2014
    population: Complete adult fasting baseline below age top-code, linked, with positive examination follow-up;
      frozen RFC-1 domain
    geography: United States
    unit: Censored log score, integrated event intensity, observed/expected ratio, record counts
    numerical_controls: Frozen existing mortality_development and nhanes_glycemic_prevalence.analysis; no
      new numerical calibration or thresholds
    uncertainty: Pointwise survey-design uncertainty conditional on all four frozen fitted models. No coefficient
      resampling, multiplicity-adjusted superiority claim, clinical pass tolerance or total-uncertainty
      claim.
    transformation: demeter.analysis.mortality_validation.validation_report
  observation_state_mapping:
    status: derived
    evidence_grade: C
    model_role: benchmark_only
    population: U.S. noninstitutionalized adults in the positive-weight NHANES 2017-March 2020 fasting subsample,
      excluding known pregnancy within the public age window
    geography: United States
    time_period: 2017-March 2020
    unit: fraction of eligible survey weight; unweighted records
    rfc: docs/rfcs/RFC-56-observation-state-mapping.md
    definitions:
    - nhanes_glycemic_prevalence.analysis
    - nhanes_prechronic_candidates.analysis
    topcoded_age: 80
    definition_sources:
      age_and_population: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/P_DEMO.htm
      diagnosis: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/P_DIQ.htm
    uncertainty: Existing Taylor logit-t pointwise survey intervals; shared observations, not independent
      draws. Missingness, diagnostic error, definition and transport uncertainty not identified.
    direct_initialization_allowed: false
    crosswalk:
    - observation: normoglycemia
      structure: legacy
      candidate_state: healthy
      mapping_status: unresolved
      reason: Normal glycemia does not identify overall metabolic health or absence of other disease.
    - observation: prediabetes
      structure: legacy
      candidate_state: ir
      mapping_status: unresolved
      reason: The glycemic threshold category does not identify all insulin resistance.
    - observation: diabetes_any_type
      structure: all
      candidate_state: t2d
      mapping_status: unresolved
      reason: Diabetes type is not identified; no subtraction or assumed T2D fraction.
    - observation: lower_measured_risk
      structure: risk_1/risk_2
      candidate_state: healthy
      mapping_status: unresolved
      reason: Lower measured risk is not proof of general health; diagnoses and markers are incomplete.
    - observation: prechronic_candidate
      structure: risk_1/risk_2
      candidate_state: prechronic
      mapping_status: definition_only
      reason: Matches a candidate observation rule, not a clinical diagnosis or transported national stock.
    - observation: prediabetes
      structure: risk_1/risk_2
      candidate_state: prediabetes
      mapping_status: definition_only
      reason: Observation label aligns; complete-case selection, age and temporal transport remain unresolved.
    - observation: other_reported_diagnosis
      structure: risk_1/risk_2
      candidate_state: null
      mapping_status: unrepresented
      reason: No corresponding engine stock. These people must not be dropped or declared healthy.
    - observation: unclassified
      structure: all
      candidate_state: null
      mapping_status: unclassified
      reason: Missing interview or measurements remain unknown; no imputation or healthy assignment.
    limitations:
    - Public cross-sectional observations cannot identify latent state or transition rates.
    - Adult, noninstitutionalized survey population and 2017-March 2020 period do not directly initialize
      every age of the 2024 engine population.
    - Public age top-coding prevents single-age decomposition in the oldest group; no pediatric interpolation
      is performed.
    - Known diagnoses retain precedence within complete cases; incomplete records can remain unclassified
      despite known diabetes.
    - Treatment use, control duration, diabetes type, all chronic diseases and confirmed remission are not
      identified.
    - PreChronic alternatives and overlapping age domains share observations and must not be summed.
    - No active model parameter or numerical engine output changes.
  observation_partial_mapping:
    status: derived
    evidence_grade: C
    model_role: benchmark_only
    direct_initialization_allowed: false
    method: compatible_categories_v1
    rfc: docs/rfcs/RFC-56-observation-state-mapping.md
    definitions:
    - observation_state_mapping
    - nhanes_glycemic_prevalence.analysis
    - nhanes_prechronic_candidates.analysis
    population: U.S. noninstitutionalized adults in the eligible NHANES 2017-March 2020 fasting subsample
    geography: United States
    time_period: 2017-March 2020
    unit: fraction of all eligible survey weight; unweighted records
    interview_codes:
      'yes': 1
      'no': 2
      no_diabetes_diagnosis: [2, 3]
    definition_sources:
      diagnosis: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/P_DIQ.htm
      glucose: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/P_GLU.htm
      hba1c: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/P_GHB.htm
    blood_pressure_missingness: Treat the marker as unknown unless all six existing required readings
      are finite and positive; do not average fewer readings. This coarsening gives conservative bounds.
    uncertainty: Logical compatible-category bounds conditional on recorded rules, with separate Taylor
      logit-t sampling intervals for each bound endpoint. Not a simultaneous confidence region or an
      initialization distribution. No missing-at-random assumption or diagnostic-error model.
    limitations:
    - Bounds concern the registered observation categories, not true latent health states.
    - Any-type diabetes does not identify T2D; normoglycemia does not identify general metabolic health.
    - Adult survey observations from 2017-March 2020 do not resolve pediatric, oldest-age, institutionalized
      or current-year population transport. Survey-selection and diagnostic errors remain unresolved.
    - A single high laboratory measurement is an observation category, not a confirmed clinical diagnosis.
    - Partially observed blood-pressure blocks are coarsened; bounds need not be sharp over raw completions.
    - Known diabetes takes priority despite unrelated missing measurements in this alternative;
      the original complete-case report remains available separately.
    - Unknown values remain sets of possible categories; no imputation or automatic engine allocation.
  mortality_development:
    status: derived
    evidence_grade: C
    model_role: development_benchmark_only
    protocol: docs/rfcs/RFC-1-health-calibration.md
    source_dataset: nhanes_linked_mortality
    development_cycle: 2011-2012
    reserved_cycle: 2013-2014
    topcoded_age: 80
    months_per_year: 12
    coefficients:
      glycemic:
      - mortality_development_glycemic_intercept
      - mortality_development_glycemic_age
      - mortality_development_glycemic_male
      - mortality_development_glycemic_prediabetes
      - mortality_development_glycemic_diabetes_any_type
      'null':
      - mortality_development_null_intercept
      - mortality_development_null_age
      - mortality_development_null_male
      glycemic_piecewise:
      - mortality_development_glycemic_piecewise_intercept
      - mortality_development_glycemic_piecewise_age
      - mortality_development_glycemic_piecewise_male
      - mortality_development_glycemic_piecewise_prediabetes
      - mortality_development_glycemic_piecewise_diabetes_any_type
      - mortality_development_glycemic_piecewise_age_hinge
      null_piecewise:
      - mortality_development_null_piecewise_intercept
      - mortality_development_null_piecewise_age
      - mortality_development_null_piecewise_male
      - mortality_development_null_piecewise_age_hinge
    optimizer:
      method: trust-exact
      gradient_tolerance: 1.0e-08
      maximum_iterations: 500
    integration:
      series_threshold: 0.1
      series_terms: 24
    uncertainty: Survey score sandwich; all positive-weight strata/PSUs including zero-domain
      scores; t intervals using design PSU-minus-stratum degrees of freedom; covariance
      retained jointly
    weight_adjustment: 'None: complete-case and linkage selection remain unresolved'
    interpretation: Development numerical fit only; no holdout validation or clinical
      promotion
    alternative_age:
      kind: continuous_piecewise_log_hazard
      knot_age: 60
      status: modeling_convention
      rationale: Existing registered older-adult survey domain boundary; selected before
        alternative fitting, after original development fit; not selected from residuals
      declaration: docs/rfcs/RFC-1-health-calibration.md
  nhanes_linked_mortality:
    title: NHANES glycemic baseline and public-use linked mortality feasibility
    cycle: 2011-2012
    status: derived
    evidence_grade: C
    model_role: feasibility_only
    population: U.S. civilian noninstitutionalized adults with positive fasting subsample weight; complete glycemic observations
    geography: United States
    time_period: Baseline 2011-2012; mortality follow-up through December 31, 2019
    source_store: data/sources/nhanes-mortality/2011-2012
    unit: unweighted record counts, months, and survey-weighted linkage eligibility fractions
    baseline_definition: Inherit nhanes_glycemic_prevalence.analysis cutoffs, adult age, pregnancy exclusion, age domains, and interval level; do not inherit its period or weights
    weight: WTSAF2YR
    followup: PERMTH_EXM; missing and zero months reported explicitly
    mortality_definition: MORTSTAT for ELIGSTAT=1 only; ineligible linkage is missing, never alive
    layout_source: https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/R_ReadInProgramAllSurveys.R
    definition_source: https://www.cdc.gov/nchs/data/datalinkage/public-use-linked-mortality-file-description.pdf
    uncertainty: Survey-design Taylor ratio standard errors and logit-t intervals for linkage eligibility only; event counts are descriptive and have no fitted hazard interval
    transformation: demeter.data.linked_mortality.audit
    limitations:
      - Baseline-state mortality association cannot identify current-state causal mortality effects or progression/reversal.
      - Public-use follow-up times may be perturbed; adult vital status is not perturbed.
      - Age is top-coded at 80; no pediatric mortality observations in the public release.
      - This inspected cycle is development data; independent validation cycles and fitting criteria remain to be declared before fitting.
  glp1_benchmarks:
    model_role: benchmark_only
    evidence_appraisal:
      trials:
        evidence_grade: A
        design: Randomized treatment comparisons for trial-specific weight endpoints
        scope: Causal interpretation limited to the randomized contrast, regimen, trial population and estimand; no metabolic-hazard or mortality transport
      persistence:
        evidence_grade: C
        design: Retrospective EHR dispensing cohort; Kaplan-Meier first-event probabilities
        scope: Descriptive utilization evidence, not a randomized price/access effect; selected reinitiation cohort
    trial_ids:
    - NCT03548935
    - NCT03548987
    outcome_title:
      NCT03548935: Change in Body Weight (%)
      NCT03548987: Change From Randomisation to Week 68 in Body Weight (%)
    population: Trial-specific adults with overweight/obesity; STEP trials exclude
      diabetes; persistence study includes T2D/non-T2D strata
    geography: Multinational trials; US observational persistence
    source_urls:
    - https://clinicaltrials.gov/api/v2/studies/NCT03548935
    - https://clinicaltrials.gov/api/v2/studies/NCT03548987
    - https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2829779
    limitations:
    - No clinical calibration, drug-class pooling, BMI eligibility transport or mortality
      inference.
    - Trial available-case mean/SD and treatment-policy difference/CI are distinct
      estimands.
    - No direct bridge from body-weight percent to Demeter metabolic hazards has been
      validated.
  diet_response_challenge:
    status: derived
    evidence_grade: B
    model_role: historical_challenge_only
    source: Gregg et al. JAMA 2012 Figure 2 complete-case observations, corroborated at years 1 and 4 by NIDDK
    source_url: https://jamanetwork.com/journals/jama/fullarticle/1486829
    population: Look AHEAD adults with established T2D and overweight/obesity; includes baseline insulin users
    geography: United States trial sites
    time_period: Annual follow-up years 1-4; publication 2012
    unit: percent remission and percentage-point differences
    uncertainty: Published 95% CIs; repeated-measure covariance and transport uncertainty unresolved; do not fit national UPF effects
    transformation: Verify source receipts, reconcile counts with rounded published percentages, cross-check official NIH endpoint summary; challenge constant-response shortcut without fitting engine parameters
    source_store: data/sources/diet-dynamics/2026-09-27
    years: [1, 2, 3, 4]
    corroborated_years: [1, 4]
    rounding_tolerance_percent: 0.05
    lag_parameter: diet_lag_years
    curve_candidates: [low, value, high]
    limitations:
      - Multicomponent lifestyle trial cannot identify a causal UPF coefficient, its lag, or national age-specific transition rates.
      - Trial remission is not model healthy state or ordinary prediabetes; diagnosed history and medication status require a separate observation model.
      - A lagged response is a hazard modifier, not remission prevalence; a direct response-to-prevalence shortcut is challenged, not treated as a valid calibration.
      - The engine currently leaves T2D absorbing. This known structural limitation remains visible and is not repaired by changing a lag.
      - Time-varying adherence, eligibility, duration of diabetes, attrition, relapse and changing treatment intensity are unresolved; no fitted optimum lag is reported.
  food_exposure_ontology:
    schema_version: 1
    status: derived
    evidence_grade: C
    model_role: exposure_contract
    baseline_dataset: dietary_baselines
    definitions:
      upf:
        kind: food_category
        unit: percent_energy
        definition: Nova ultra-processed foods as a percentage of total reported energy; NCHS Data Brief 536 operational definition
        availability: active_validation
        physical_min: 0
        physical_max: 100
        baseline_available: true
        effect_parameters: [beta_upf_progression, diet_lag_years]
        overlap: [fiber, fruit_veg, added_sugar, total_sugar, refined_carbohydrate, total_energy, protein, saturated_fat]
        limitation: Published baseline is observational. Relative-dose envelope and causal response remain synthetic; no food substitution or energy balance is inferred.
      fiber:
        kind: nutrient
        unit: g/day
        definition: Total dietary fiber reported in the first 24-hour recall (DR1TFIBE)
        availability: observed_context
        physical_min: 0
        baseline_available: true
        overlap: [upf, fruit_veg, refined_carbohydrate, total_energy]
        limitation: No independent fiber-to-transition effect identified; same-day intake is not usual intake.
      total_energy:
        kind: energy
        unit: kcal/day
        definition: Total reported dietary energy in the first 24-hour recall (DR1TKCAL)
        availability: observed_context
        physical_min: 0
        baseline_available: true
        overlap: [upf, fiber, total_sugar, protein, saturated_fat]
        limitation: Context only; no energy-balance, body-weight, or metabolic mediation equation is implemented.
      total_sugar:
        kind: nutrient
        unit: g/day
        definition: Total sugars in the first 24-hour recall (DR1TSUGR), including naturally occurring sugars
        availability: observed_context
        physical_min: 0
        baseline_available: true
        overlap: [upf, added_sugar, total_energy, fruit_veg]
        limitation: Cannot substitute for added sugar; no independent causal effect is implemented.
      protein:
        kind: nutrient
        unit: g/day
        definition: Total protein amount in the first 24-hour recall (DR1TPROT)
        availability: observed_context
        physical_min: 0
        baseline_available: true
        overlap: [upf, protein_quality, total_energy]
        limitation: Protein amount does not establish amino-acid composition or protein quality.
      saturated_fat:
        kind: nutrient
        unit: g/day
        definition: Total saturated fatty acids in the first 24-hour recall (DR1TSFAT)
        availability: observed_context
        physical_min: 0
        baseline_available: true
        overlap: [upf, fat_quality, total_energy]
        limitation: Not an overall fat-quality index; replacement nutrient and causal effect remain unresolved.
      fruit_veg:
        kind: food_category
        unit: cup_equivalents/day
        definition: Candidate combined fruit/vegetable cup equivalents; juice and subgroup inclusion unresolved
        availability: unresolved
        physical_min: 0
        overlap: [fiber, total_sugar, upf]
        limitation: Requires a pinned food-pattern conversion and operational definition before activation.
      added_sugar:
        kind: nutrient
        unit: g/day
        definition: Sugars added during processing or preparation; excludes naturally occurring sugar
        availability: unresolved
        physical_min: 0
        overlap: [total_sugar, upf, total_energy]
        limitation: Day-one total-sugar field cannot identify this; food-pattern conversion and causal mapping required.
      refined_carbohydrate:
        kind: food_category
        unit: null
        definition: Candidate refined-grain/carbohydrate exposure; load and food classification unresolved
        availability: unresolved
        overlap: [upf, fiber, added_sugar, total_energy]
        limitation: No reproducible load index or independent response identified; not activated.
      protein_quality:
        kind: quality_index
        unit: null
        definition: Candidate digestibility/amino-acid adequacy measure
        availability: unresolved
        overlap: [protein]
        limitation: No selected reproducible index, baseline distribution, or causal mapping.
      fat_quality:
        kind: quality_index
        unit: null
        definition: Candidate fatty-acid composition/replacement measure
        availability: unresolved
        overlap: [saturated_fat, omega3, upf]
        limitation: No selected index or substitution-specific causal mapping; not equivalent to saturated fat.
      omega3:
        kind: nutrient
        unit: g/day
        definition: Candidate omega-3 intake; ALA versus EPA/DHA and supplement inclusion unresolved
        availability: unresolved
        physical_min: 0
        overlap: [fat_quality, total_energy]
        limitation: Species definition, dietary/supplement baseline, and population-specific effect required.
      nutrient_density:
        kind: quality_index
        unit: null
        definition: Deferred composite nutrient-density variable
        availability: unresolved
        overlap: [fiber, fruit_veg, protein_quality, fat_quality, total_energy]
        limitation: No reproducible index selected; do not double count its components as independent effects.
  dietary_baselines:
    status: derived
    evidence_grade: C
    model_role: exposure_reference_only
    source: CDC/NCHS NHANES and USDA WWEIA day-one nutrient recalls; NCHS Data Brief 536 UPF tables
    source_url: https://wwwn.cdc.gov/nchs/nhanes/search/datapage.aspx?Component=Dietary
    population: U.S. civilian noninstitutionalized adults 20+; reliable day-one recall; pregnancy not excluded; published UPF uses adults 19+
    geography: United States
    time_period: Selected cycles 2005-2006, 2013-2014, 2017-March 2020, August 2021-August 2023; published UPF 2013-2023
    unit: g/day, kcal/day, and percent of energy as identified per exposure
    uncertainty: Dietary-weight Taylor means and domain t intervals; weighted reported-day quantiles; published UPF standard errors
    source_store: data/sources/dietary/2026-09-27
    transformation: Verify raw bytes, join demographics by SEQN, retain complete reliable recalls, estimate survey domains; extract published UPF HTML tables
    cycles:
      - {id: '2005_2006', demographics_file: DEMO_D.xpt, demographics_store: dietary, dietary_file: DR1TOT_D.xpt, weight: WTDRD1, mode_change: false}
      - {id: '2013_2014', demographics_file: DEMO_H.xpt, demographics_store: dietary, dietary_file: DR1TOT_H.xpt, weight: WTDRD1, mode_change: false}
      - {id: '2017_2020', demographics_file: P_DEMO.xpt, demographics_store: nhanes, dietary_file: P_DR1TOT.xpt, weight: WTDRD1PP, mode_change: false}
      - {id: '2021_2023', demographics_file: DEMO_L.xpt, demographics_store: dietary, dietary_file: DR1TOT_L.xpt, weight: WTDRD1, mode_change: true}
    analysis:
      reliable_recall_code: 1
      confidence_level: 0.95
      quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
      age_groups:
        - {id: 20_plus, min: 20, max: null}
        - {id: '20_39', min: 20, max: 39}
        - {id: '40_59', min: 40, max: 59}
        - {id: 60_plus, min: 60, max: null}
      nutrients:
        fiber: {column: DR1TFIBE, unit: g/day}
        total_energy: {column: DR1TKCAL, unit: kcal/day}
        total_sugar: {column: DR1TSUGR, unit: g/day}
        protein: {column: DR1TPROT, unit: g/day}
        saturated_fat: {column: DR1TSFAT, unit: g/day}
    upf:
      source_url: https://www.cdc.gov/nchs/products/databriefs/db536.htm
      table_count: 5
      expected_adult_records: 9
      current_period: '2021_2023'
      period_labels: {'2013–2014': '2013_2014', '2015–2016': '2015_2016', '2017–2018': '2017_2018', 'August 2021–August 2023': '2021_2023'}
      age_labels: {'19–39': '19_39', '40–59': '40_59', '60 and older': 60_plus}
    limitations:
      - Single-day distributions reflect reporting and within-person variation, not usual intake distributions or causal dose-response ranges.
      - Day-one dietary weights differ from fasting/MEC weights; cycles are analyzed separately, not pooled or summed.
      - 2021-2023 moved the first recall from in-person to telephone; historical differences can reflect mode/composition changes.
      - Published UPF means use adults 19+, whereas nutrient reconstruction uses adults 20+; no automatic matched population is implied.
      - UPF microdata/Nova coding are not reconstructed here; published tables supply means and SEs, not individual distributions.
      - Total sugars are not added sugars, protein amount is not protein quality, and saturated fat is not an overall fat-quality index.
      - No imputation or item-nonresponse reweighting; source measurement error, food-code changes and reporting bias remain outside sampling intervals.
      - Observed intake bounds and quantiles are descriptive, not validated intervention ranges; baselines do not identify causal effects.
  nhanes_prechronic_candidates:
    status: derived
    evidence_grade: C
    model_role: benchmark_only
    source: CDC/NCHS NHANES 2017-March 2020 public-use fasting subsample
    source_url: https://wwwn.cdc.gov/nchs/nhanes/continuousnhanes/default.aspx?Cycle=2017-2020
    population: U.S. civilian noninstitutionalized adults 20+; known pregnancy excluded; complete measured/interview records
    geography: United States
    time_period: 2017-March 2020
    unit: fraction and survey-weighted people
    source_store: data/sources/nhanes-risk/2017-2020
    definition_source: https://www.nhlbi.nih.gov/health/metabolic-syndrome/diagnosis
    transformation: Join risk and glycemic files by SEQN; full fasting survey design; complete-case disjoint definitions; Taylor survey estimates by age/sex
    uncertainty: Taylor logit-t proportions and linearized weighted totals; sampling uncertainty only; definition alternatives reported separately
    analysis:
      waist_male_cm: 101.6
      waist_female_cm: 88.9
      waist_rule: Strictly greater than NHLBI 40/35 inches converted at exactly 2.54 cm/inch; not ethnicity-specific
      systolic_mmhg: 130
      diastolic_mmhg: 85
      bp_rule: Mean of all three oscillometric readings; either mean at least threshold; one combined BP marker
      hdl_male_mg_dl: 40
      hdl_female_mg_dl: 50
      hdl_rule: Strictly less than threshold
      triglycerides_mg_dl: 150
      triglyceride_rule: Strictly greater than threshold per cited NHLBI page
      diagnosis_columns: [BPQ020, BPQ080, MCQ160B, MCQ160C, MCQ160D, MCQ160E, MCQ160F, MCQ220]
      diagnosis_rule: Yes to known hypertension, high cholesterol, CHF, CHD, angina, MI, stroke or cancer excludes candidate status; unknown responses excluded
      definitions: {risk_1: 1, risk_2: 2}
      definition_status: Synthetic operational choices for structural comparison, not clinically validated PreChronic thresholds; individual marker cutoffs are sourced definitions
      glycemic_definition: Inherit registered nhanes_glycemic_prevalence analysis; diabetes then prediabetes take priority
    limitations:
      - PreChronic candidates are research definitions, not clinical diagnoses, metabolic syndrome, or established insulin resistance.
      - Counts represent survey-weighted classified respondents; missing items are not imputed or reweighted, so full population size remains uncertain.
      - Single measurements and self-reported diagnosis exclusions do not prove absence of all chronic disease; other conditions, treatment and access-to-diagnosis remain incompletely measured.
      - Waist thresholds are not ethnicity-specific; no fitness or direct insulin-resistance measure is used.
      - The two definitions share observations and are not independent evidence; lower_measured_risk is a complement, not proof of good health.
      - Glycemic diabetes includes all types and cannot silently initialize model T2D; 2017-2020 cross-sections do not identify transitions or 2024 prevalence.
      - Intervals omit item-nonresponse bias, measurement error, structural ambiguity, and full NCHS reliability screening; sparse estimates need caution.
  healthspan_method_benchmark:
    status: observed
    evidence_grade: C
    source: CDC/NCHS Statistical Notes 21, Table 2, page 6
    source_url: https://www.cdc.gov/nchs/data/statnt/statnt21.pdf
    population: U.S. White females, as labeled by the source; NHIS self-reported good-or-better health
    geography: United States
    time_period: '1995; published August 2001'
    unit: survivors, person-years, prevalence fractions, and years of remaining self-reported healthy life
