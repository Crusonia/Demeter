datasets:
  us_mortality:
    status: observed
    source: CDC/NCHS U.S. life tables, Tables 1–3
    unit: annual probability and life-table person-years
    vintages:
    - 2022
    - 2023
    - 2024
    manifest: src/demeter/data/bundled/manifest.json
    transformation: demeter.data.ingest.transform_life_table; ax derived from Lx,lx,dx
    uncertainty: Published qx treated as fixed; sampling uncertainty not propagated
  us_population:
    status: observed
    source: Census Vintage 2025 resident population estimates
    unit: people by single age and sex
    vintages:
    - 2022
    - 2023
    - 2024
    manifest: src/demeter/data/bundled/manifest.json
    transformation: Select SEX 0/1/2, AGE 0..100, POPESTIMATE year; 100 is open group
    uncertainty: Published estimates treated as fixed; demographic uncertainty not
      propagated
scientific_blockers:
- National age-specific metabolic transition hazards are unresolved.
- Age-specific T2D/prediabetes initial prevalence is not calibrated; CDC total diabetes
  includes other types.
- Dietary causal coefficient, dose scale, lag, and supported population are unresolved.
- State mortality hazard ratios remain synthetic.
- No historical end-to-end dietary-effect validation; mortality persistence backtest
  is a limited benchmark.
