    population: Original impaired-glucose-tolerance trial cohort in Da Qing, China; retained clinical follow-up
      subset. Pooled clinic-randomized diet/exercise interventions and control; no current-state or U.S.
      mapping.
    geography: Da Qing, China
    time_period: 1986-2009; scheduled OGTT during original trial, then mainly clinical diagnosis ascertainment
      between later follow-up assessments.
    unit: Literal deaths and published whole person-years by updated age and time before or since recorded
      diabetes diagnosis
    uncertainty: Source observations retain displayed precision. No sampling distribution, confidence interval,
      covariance or independence assumption imposed; repeated person-time and clinic dependence unresolved.
    transformation: Literal integer deaths/person-year source cells and consistency arithmetic only; no
      rates, likelihood, causal estimates or independent draws. Recorded source-count discrepancy retained.
    description: Used-source mortality observation coverage by updated age and time before/since recorded
      diagnosis. Baseline IGT does not identify current glycemic state. The registered hashed authored observations
      are source facts, not engine parameters.
    design_inputs:
    - I-01
    - I-07
    - I-11
    - I-12
    - F-04
    - F-08
    - T-05
    - T-08

scientific_blockers:
- National age-specific metabolic transition hazards are unresolved.
- Age-specific T2D/prediabetes initial prevalence is not calibrated; CDC total diabetes includes
  other types.
- Dietary causal coefficient, dose scale, lag, and supported population are unresolved.
- State mortality hazard ratios remain synthetic.
- No historical end-to-end dietary-effect validation; mortality persistence backtest is a limited
  benchmark.

