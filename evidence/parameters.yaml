    transformation: Table 2 point estimate and CI multiplied by 0.001; no conversion to a model transition
      hazard.
    applicability:
      candidate_for:
      - ir_to_t2d_rate
      estimand: Incidence density from baseline glycemic group
      source_locator: Table 2; Prediabetes (HbA1c 5.7%-6.4%); matching row occurrence 1; column 3
      source_population: ARIC visit-5 participants without diabetes; ages 71-90 at baseline; community
        cohort.
      transport_status: benchmark_only
      blockers:
      - ARIC older community cohort is not a national all-age/sex population.
      - Glycemic criteria are not the model's broad insulin-resistance proxy.
      - Total diabetes endpoint is not type-specific.
      - Baseline-group incidence density does not identify a current-state Markov hazard with regression
        and competing mortality.
      extraction:
        table_index: 1
        row_label: Prediabetes (HbA1c 5.7%-6.4%)
        row_occurrence: 0
        column_index: 2
        scale: 0.001
