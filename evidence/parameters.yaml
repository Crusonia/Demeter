      equation: L(P|C,n)=product_i[n_i!/product_j c_ij! * product_j p_ij^c_ij], with sum_j p_ij=1
        for each row
      assumptions:
      - Independent observations within each selected baseline row
      - A common marginal row probability for the published timing/age/selection mixture
      - Conditional independence of the two disjoint baseline groups given their row totals
      assumptions_empirically_established: false
