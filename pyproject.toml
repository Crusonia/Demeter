[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "demeter-model"
version = "0.1.0a1"
description = "A systems model of food, health, agriculture, and longevity"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "bptk-py>=3.1,<4",
  "numpy>=2.0",
  "polars>=1.44,<2",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "openpyxl>=3.1,<4",
  "SALib>=1.5,<2",
  "plotly>=6,<7",
  "networkx>=3.4,<4",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
studio = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "filelock>=3.18,<4"]
analysis = [
  "lifelines>=0.30,<0.31",
  "SALib>=1.5",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
demeter = "demeter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/demeter"]

[tool.hatch.build.targets.wheel.force-include]
"build/explorer" = "demeter/explorer/static"
"data/rights.json" = "demeter/data/notices/rights.json"
"data/evidence-packages.json" = "demeter/data/notices/evidence-packages.json"
"data/NOTICE.md" = "demeter/data/notices/NOTICE.md"

[tool.hatch.build]
exclude = ["data/raw/**", "data/processed/**", "outputs/**", "web/node_modules/**", "web/.next/**", "web/out/**"]
artifacts = ["build/explorer/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "playwright==1.51.0",
    "pytest>=8.3",
    "ruff>=0.8",
]
