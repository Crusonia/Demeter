name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Retain the complete platform gates as source audits and fixtures grow.
    timeout-minutes: 30
    env:
      # Keep uv run on the matrix version even with the novice .python-version pin.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.11', label: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12', label: '3.12'}
          - {os: macos-latest, python-version: '3.12', label: macOS}
          - {os: windows-latest, python-version: '3.12', label: Windows}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --extra studio --python ${{ matrix.python-version }}
          uv run python --version
      - name: Lint
        run: uv run ruff check .
      - name: Audit committed conditional iPOP working analysis offline
        run: |
          uv run python scripts/verify_ipop_a1c_working_fit.py --output outputs/ipop-a1c-integrity.json
          uv run python scripts/verify_ipop_a1c_working_fit.py --numerical-method exact_box_quadratic_v2 --output outputs/ipop-a1c-integrity-v2.json
          uv run python scripts/verify_ipop_predictive_supplement.py
      - name: Test offline fixtures, CLI, and executable learning notebook
        run: uv run --extra studio python -X utf8 -m pytest
      - name: Check and build static Explorer
        run: |
          npm ci --prefix web
          npm run check --prefix web
          npm test --prefix web
          uv run python scripts/build_explorer.py
      - name: Verify committed source bytes and rebuild offline
        run: uv run python scripts/verify_source_archive.py --rebuild
      - name: Validate evidence and authoritative baselines
        run: uv run demeter validate
      - name: Check frozen synthetic longitudinal likelihood
        run: uv run demeter evidence longitudinal-likelihood --output outputs/longitudinal-likelihood.json
      - name: Reproduce pinned Geelong label observations offline
        run: |
          uv run demeter evidence geelong-labels --output outputs/geelong-labels.json
          uv run demeter evidence geelong-labels --descriptive-only --output outputs/geelong-descriptive.json
          uv run python scripts/verify_geelong_labels.py
      - name: Verify repository datasets and reload NHANES offline
        run: |
          uv run demeter data verify-store
          uv run demeter data rebuild-nhanes --destination outputs/nhanes-rebuilt
          uv run demeter evidence population --output outputs/population-evidence.json
          uv run demeter evidence state-mapping --output outputs/state-mapping.json
          uv run python scripts/verify_joint_glycemic_uncertainty.py
          uv run demeter data rebuild-linked-mortality
          uv run demeter evidence linked-mortality --output outputs/linked-mortality-evidence.json
          uv run python scripts/fit_mortality_development.py
          uv run python scripts/validate_mortality_holdout.py
          uv run demeter data rebuild-healthspan
          uv run demeter evidence healthspan --output outputs/healthspan-method-check.json
          uv run demeter data rebuild-prechronic
          uv run demeter evidence prechronic --output outputs/prechronic-evidence.json
          uv run demeter data rebuild-dietary
          uv run demeter food-exposures --output outputs/food-exposures.json
          uv run demeter data rebuild-diet-response
          uv run demeter diet-lag-challenge --output outputs/diet-lag-challenge.json
          uv run demeter data rebuild-glp1
          uv run demeter evidence glp1 --output outputs/glp1-evidence.json
      - name: Audit data rights and evidence package inventory
        run: |
          uv run demeter data verify-packages --check-tracked --output outputs/package-audit.json
          uv run python scripts/verify_kerala_registered_coverage.py --output outputs/kerala-registered-integrity.json
          uv run python scripts/verify_kerala_endpoints.py
          uv run python scripts/verify_kerala_observations.py
          uv run python scripts/verify_malawi_cohort.py
          uv run python scripts/verify_aric_outcomes.py
      - name: Run baseline and scenario comparison
        run: |
          uv run demeter simulate scenarios/baseline.yaml --output outputs/baseline.json
          uv run demeter compare scenarios/baseline.yaml scenarios/reduce_upf_30.yaml
          uv run demeter compare scenarios/prechronic_baseline.yaml scenarios/prechronic_reduce_upf_30.yaml
          uv run demeter simulate scenarios/dietary_upf_30.yaml --output outputs/dietary-upf.json
          uv run demeter timing-sensitivity --samples 8 --seed 42 --output outputs/timing-sensitivity.json
          uv run demeter simulate scenarios/glp1_access.yaml --output outputs/glp1.json
      - name: Historical holdout diagnostics
        run: uv run demeter historical-backtest --output outputs/historical-backtest.json
      - name: Explicit custom health module
        run: uv run demeter simulate scenarios/reduce_upf_30.yaml --transition-module demeter.examples.transition_modules:NoDietEffect --output outputs/module-null.json
      - name: Register local package and compare alternative structures
        run: |
          uv run demeter extensions list
          uv run demeter extensions inspect examples/community_null/package.yaml
          uv run demeter extensions register examples/community_null/package.yaml
          uv run demeter extensions run community.null@1.0.0 reduce_upf_30 --module null --output outputs/community-null.json
          uv run demeter extensions compare demeter.core@1.0.0 baseline demeter.experiments@1.0.0 prechronic_baseline --output outputs/structure-comparison.json
      - name: Food leverage and pathway attribution
        run: uv run demeter leverage --scenario scenarios/diet_dynamics.yaml --draws 2 --samples 8 --seed 42 --destination outputs/leverage
      - name: Scientific observability smoke
        run: uv run demeter observe scenarios/reduce_upf_30.yaml --draws 4 --samples 8 --destination outputs/observability
      - name: Render report in offline Chromium
        if: matrix.label == '3.12'
        run: |
          uv run playwright install --with-deps chromium
          uv run python scripts/verify_observability_browser.py
          uv run demeter observe scenarios/prechronic_reduce_upf_30.yaml --draws 4 --samples 8 --destination outputs/prechronic-report
          uv run python scripts/verify_observability_browser.py --report outputs/prechronic-report/index.html --figures 46
          uv run demeter observe scenarios/diet_dynamics.yaml --draws 4 --samples 8 --destination outputs/diet-dynamics-report
          uv run python scripts/verify_observability_browser.py --report outputs/diet-dynamics-report/index.html --figures 57
          uv run demeter observe scenarios/glp1_access.yaml --draws 4 --samples 8 --destination outputs/glp1-report
          uv run python scripts/verify_observability_browser.py --report outputs/glp1-report/index.html --figures 65
          uv run python scripts/verify_observability_browser.py --report outputs/leverage/index.html --figures 26
          uv run --extra studio python scripts/verify_explorer_browser.py
      - name: Build package
        run: uv build
      - name: Verify evidence distribution contents
        run: uv run python scripts/verify_evidence_distribution.py
      - name: Archive canonical outputs and replay extracted source
        run: |
          uv run demeter release build outputs/release-ci --draws 4 --samples 8 --seed 42
          uv run demeter release verify outputs/release-ci
          uv run demeter release extract outputs/release-ci --destination outputs/release-source
          uv run python scripts/verify_release_replay.py --bundle outputs/release-ci --source outputs/release-source --output outputs/release-replay.json
      - name: Retain engineering bundle and numerical replay receipt
        if: matrix.label == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: engineering-checkpoint-${{ github.sha }}
          path: |
            outputs/release-ci/
            outputs/release-replay.json
          if-no-files-found: error
          retention-days: 30
